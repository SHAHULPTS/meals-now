services:
  postgres:
    image: postgres:18
    container_name: mealsnow-postgres
    environment:
      POSTGRES_DB: mealsnow
      POSTGRES_USER: mealsnow
      POSTGRES_PASSWORD: mealsnow_dev_pw
    ports:
      - "5433:5432"
    volumes:
      - mealsnow_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealsnow -d mealsnow"]
      interval: 10s
      timeout: 5s
      retries: 5
  kafka:
    image: apache/kafka:3.9.1
    container_name: mealsnow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID : 1
      KAFKA_PROCESS_ROLES: broker , controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092   # ← the trap: what clients are told to use
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1                # single node → replication 1, not the default 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0               # consumers join instantly in dev
    healthcheck:
        test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
        interval: 10s
        timeout: 5s
        retries: 5

volumes:
  mealsnow_pgdata:

