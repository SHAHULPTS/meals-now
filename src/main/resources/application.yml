spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/mealsnow
    username: mealsnow
    password: mealsnow_dev_pw
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
  profiles:
    active: dev
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: <a long random base64 string, 32+ bytes>
    expiration-ms: 3600000

logging:
  level:
    org.springframework.security: DEBUG